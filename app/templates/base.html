<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TestCase Lite{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{{ url_for('main.index') }}">✓ TestCase Lite</a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="{{ url_for('main.index') }}">Painel</a>
      <a class="nav-link" href="{{ url_for('main.new_case') }}">Novo caso</a>
      <a class="nav-link" href="{{ url_for('main.ai_suggestions') }}">Assistente de sugestões</a>
    </div>
  </div>
</nav>
<main class="container py-4">
  {% for category, message in get_flashed_messages(with_categories=true) %}
    <div class="alert {{ 'alert-danger' if category == 'error' else 'alert-success' }} alert-dismissible fade show" role="alert">
      {{ message }} <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
<footer class="container py-4 text-muted small">TestCase Lite · MVP acadêmico para organização de testes de software</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
